<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff6a1a">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
<title>CLUTCH 🏀</title>
</head>
<body>

<button onclick="show('discover')" data-tab="discover">⌕<small>Discover</small></button>

<button onclick="show('profile')" data-tab="profile">◯<small>Profile</small></button>
